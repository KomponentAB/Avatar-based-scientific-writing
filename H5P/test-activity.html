<!DOCTYPE html>
<html lang="de">

<head>
        <script src="../scripts/workadventure-iframe-fixed.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking Test</title>
</head>

<body>
 <script>const workbookName = "test-H5P";

        (async () => {
            const WEBHOOK_URL = "https://apps.taskmagic.com/api/v1/webhooks/8yUsd0Tbmg8XaZ8KOk4eg";

            const payload = {
                id: WA.player.uuid || "1234",
                h5pid: workbookName || "test-h5p",
                timestamp: Date.now(),
                eventType: "page_open"
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                console.log("Tracking sent:", payload);
            } catch (error) {
                console.error("Tracking failed:", error);
            }
        })();
    </script>

    <h1>Hallo ${WA.player.uuid} </h1>
    <p>Beim Öffnen dieser Seite (${workbookName}) wird automatisch ein Webhook ausgelöst.</p>
   

</body>

</html>
